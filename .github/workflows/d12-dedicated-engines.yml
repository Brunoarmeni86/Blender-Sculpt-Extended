name: D12 dedicated brush reference
on:
  push:
    branches: ['experiment/physics-d12-dedicated-engines']
  pull_request:
    branches: ['experiment/physics-d11.10-13-artistic-engine']
  workflow_dispatch:
jobs:
  reference:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile scripts/startup/bl_ui/properties_paint_common.py experimental/sculpt_physics_cpu/create_physical_brush_assets.py scripts/startup/sculpt_extended_integrated/__init__.py experimental/sculpt_physics_gpu/prototype_warp_smooth_multiscale.py experimental/sculpt_physics_gpu/export_native_warp_ptx.py
      - run: cmake -S experimental/sculpt_physics_cpu -B build-d12 -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-d12 --config Release --target test_d12_dedicated_engines test_d12_smooth_multiscale test_artistic_material_v31d1110
      - run: ctest --test-dir build-d12 -C Release -R "sculpt_(d12_dedicated_engines|d12_smooth_multiscale|artistic_material_v31d1110)_tests" --output-on-failure --no-tests=error -V
  warp-multiscale-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install warp-lang==1.9.1 numpy
      - run: python experimental/sculpt_physics_gpu/prototype_warp_smooth_multiscale.py
