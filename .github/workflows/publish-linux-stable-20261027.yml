name: Publish verified stable Linux checkpoint
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: Brunoarmeni86/Blender-Sculpt-Extended
      TAG: sculpt-extended-5.2.3-stable-20261027
      SOURCE_SHA: 419776d9b890811f73d7f68a9383f32bce982836
      BUILD_RUN: '40548498022'
      ARTIFACT: Blender-Sculpt-Extended-5.2.3-Linux-x64-Rocky8-GPU-preview
      ORIGINAL: Blender-Sculpt-Extended-5.2.3-Linux-x64-Rocky8-GPU-preview.tar.xz
      GENERAL: Blender-Sculpt-Extended-5.2.3-Linux-x64.tar.xz
      PREVIOUS_TAG: sculpt-extended-5.2.3-preserve-layers-fix-20261023-preview
      ARTIFACT_ID: '12768256883'
      ARTIFACT_DIGEST: 4e518cb6dfecef0f47f0972c67565afcc664866ce17948a403f746986d47a59c
      UBUNTU: Blender-Sculpt-Extended-5.2.3-Linux-x64-Ubuntu24.tar.xz
      UBUNTU_SHA: 05869965c423dcb8f2563437f180c1644697cba66e7daa4e2c7a2e4eb98ac468
    steps:
      - name: Download exact successful build artifact
        run: |
          set -euxo pipefail
          test "$(gh api repos/$REPO/actions/runs/$BUILD_RUN --jq .conclusion)" = success
          test "$(gh api repos/$REPO/actions/runs/$BUILD_RUN --jq .head_sha)" = e4f7ea61113980e6f3d671e0c6182c6e2c84e40c
          test "$(gh api repos/$REPO/actions/artifacts/$ARTIFACT_ID --jq .workflow_run.id)" = "$BUILD_RUN"
          test "$(gh api repos/$REPO/actions/artifacts/$ARTIFACT_ID --jq .digest)" = "sha256:$ARTIFACT_DIGEST"
          gh api repos/$REPO/actions/artifacts/$ARTIFACT_ID/zip > artifact.zip
          printf '%s  artifact.zip\n' "$ARTIFACT_DIGEST" | sha256sum -c -
          mkdir artifact
          unzip -q artifact.zip -d artifact
          ls -lh artifact
      - name: Verify package, source, brush tests, GPU kernels and ABI audit
        run: |
          set -euxo pipefail
          cd artifact
          sha256sum -c SHA256SUMS.txt
          test "$(tar -xOf "$ORIGINAL" ./BUILD-PROVENANCE.txt | sed -n 's/^Approved source: //p')" = "$SOURCE_SHA"
          python3 - <<'PY'
          import json
          result=json.load(open('linux-guard-audit/RESULT.json'))
          assert len(result)==3 and all(row['status']=='PASS' for row in result),result
          mask=json.load(open('mask_gui_linux_clear_mask.json'))
          scenarios={'existing_levels_subdivide','existing_levels_object_switch','base_mesh_subdivide','higher_level_mask_retained','brush_fresh'}
          assert len(mask)==5 and {r['scenario'] for r in mask}==scenarios,mask
          assert all(r['status']=='PASS' and (r['sample_count']>=0 if r['scenario']=='brush_fresh' else r['sample_count']>0) for r in mask),mask
          for row in mask:
              expected_mask=0.25 if row['scenario']=='higher_level_mask_retained' else 0.0
              assert abs(row['mask_min']-expected_mask)<1e-7 and abs(row['mask_max']-expected_mask)<1e-7,row
          verified=json.load(open('VERIFICATION.json'))
          assert verified['source_commit']==__import__('os').environ['SOURCE_SHA']
          assert verified['status']=='VERIFIED_ROCKY8'
          assert all(verified[k]=='PASS' for k in ['smooth_l0_regressions','rna_defaults','mask_regressions','brush_regressions','gpu_abi_audit','layer_undo_repeated']),verified
          assert verified['diagnostic_errors']=='NONE'
          smooth=json.load(open('smooth-l0.json'))
          assert len(smooth)==7 and all(row['status']=='PASS' for row in smooth),smooth
          rna=json.load(open('rna-defaults.json'))
          assert len(rna)==5 and all(p['default']=='' and p['explicit_and_empty_values']=='PASS' for p in rna.values()),rna
          undo=json.load(open('linux-guard-audit/LAYER-UNDO.json'))
          assert len(undo)==4 and all(row['status']=='PASS' and row['cycles']==3 and row['max_error']<2e-6 for row in undo),undo
          assert {(row['brush'],row['preserve']) for row in undo}=={(b,p) for b in ['DRAW','SMOOTH'] for p in [True,False]},undo
          for filename in ['rna-startup.log','smooth-l0.log']:
              log=__import__('pathlib').Path(filename).read_text(errors='replace')
              assert not any(x in log for x in ['rna.define','Failure in TopologyRefiner','Incompatible existing refinement','Traceback','AssertionError']),filename
          audit=json.load(open('GPU-ABI-AUDIT.json'))
          expected={'WITH_CYCLES_DEVICE_CUDA','WITH_CYCLES_DEVICE_OPTIX','WITH_CYCLES_DEVICE_HIP','WITH_CYCLES_DEVICE_ONEAPI','WITH_CYCLES_CUDA_BINARIES','WITH_CYCLES_HIP_BINARIES'}
          assert set(audit['flags'])==expected,audit
          assert tuple(audit['max_glibc']) <= (2,28),audit
          assert audit['elf_files'] > 0,audit
          assert audit['physical_gpu_tested'] is False,audit
          PY
          tar -tf "$ORIGINAL" > package-contents.txt
          grep -Eq 'kernel_sm_[0-9]+\.cubin\.zst$' package-contents.txt
          grep -Eq 'kernel_optix.*\.ptx\.zst$' package-contents.txt
          grep -Eq 'kernel_gfx[0-9]+\.fatbin\.zst$' package-contents.txt
          grep -Eq 'libcycles_kernel_oneapi_(aot|jit)\.so$' package-contents.txt
      - name: Verify startup on Ubuntu 24.04
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libx11-6 libxi6 libxfixes3 libxrender1 libxxf86vm1 libxkbcommon0 libsm6 libice6 libegl1 libgl1 libdbus-1-3 libwayland-client0 libwayland-egl1 libpulse0 libasound2t64
          mkdir portable
          tar -xJf "artifact/$ORIGINAL" -C portable
          portable/blender --background --factory-startup --python-exit-code 1 --python-expr "import bpy; assert bpy.app.version[:3]==(5,2,3); b=bpy.data.brushes.new('Release audit',mode='SCULPT'); assert b.sculpt_preserve_other_layers; print('ROCKY_PACKAGE_STARTS_ON_UBUNTU24_PASS')" > ubuntu-startup.log 2>&1
          cat ubuntu-startup.log
          if grep -E "rna.define|Failure in TopologyRefiner|Incompatible existing refinement|Traceback|AssertionError" ubuntu-startup.log; then exit 1; fi
      - name: Prepare general-purpose package metadata
        run: |
          set -euxo pipefail
          mv "artifact/$ORIGINAL" "artifact/$GENERAL"
          ROCKY_SHA="$(sha256sum "artifact/$GENERAL" | cut -d' ' -f1)"
          printf '%s  %s\n' "$ROCKY_SHA" "$GENERAL" > artifact/SHA256SUMS-Linux-x64.txt
          python3 - <<'PY'
          import hashlib,json,os
          p='artifact/'+os.environ['GENERAL']
          with open(p,'rb') as f: sha=hashlib.file_digest(f,'sha256').hexdigest()
          manifest={
            'source_commit':os.environ['SOURCE_SHA'],
            'target':'Linux x86_64 general purpose; glibc 2.28 baseline',
            'build_environment':'Rocky Linux 8; GCC 14',
            'build_run':int(os.environ['BUILD_RUN']),
            'artifact_id':int(os.environ['ARTIFACT_ID']),
            'artifact_digest':'sha256:'+os.environ['ARTIFACT_DIGEST'],
            'brush_results':json.load(open('artifact/linux-guard-audit/RESULT.json')),
            'mask_results':json.load(open('artifact/mask_gui_linux_clear_mask.json')),
            'gpu_abi_audit':json.load(open('artifact/GPU-ABI-AUDIT.json')),
            'smooth_l0_results':json.load(open('artifact/smooth-l0.json')),
            'rna_defaults':json.load(open('artifact/rna-defaults.json')),
            'layer_undo_results':json.load(open('artifact/linux-guard-audit/LAYER-UNDO.json')),
            'verification':json.load(open('artifact/VERIFICATION.json')),
            'package':os.environ['GENERAL'],
            'sha256':sha,
            'validation':{
              'build':'PASS','startup_rocky8':'PASS','startup_ubuntu24':'PASS',
              'brush_guards':'PASS','clear_mask_gui_5_cases':'PASS','abi_glibc_max':'2.28',
              'cuda_optix_kernels':'PRESENT','hip_kernels':'PRESENT','oneapi_kernel':'PRESENT',
              'smooth_l0_7_cases':'PASS','rna_defaults_5_properties':'PASS','layer_undo_4_cases_3_cycles':'PASS','diagnostic_errors':'NONE',
              'physical_gpu_tested':False,
            },
          }
          open('artifact/BUILD-MANIFEST-Linux-x64.json','w').write(json.dumps(manifest,indent=2)+'\n')
          PY
      - name: Preserve previous releases and add Linux to the Clear Mask release
        run: |
          set -euxo pipefail
          test "$(gh api repos/$REPO/releases/tags/$PREVIOUS_TAG --jq '.assets[] | select(.name==env.UBUNTU) | .digest')" = "sha256:$UBUNTU_SHA"
          test "$(gh api repos/$REPO/git/ref/tags/$TAG --jq .object.sha)" = "$SOURCE_SHA"
          test "$(gh api repos/$REPO/releases/tags/$TAG --jq '[.assets[] | select(.name==env.GENERAL or .name=="SHA256SUMS-Linux-x64.txt" or .name=="BUILD-MANIFEST-Linux-x64.json")] | length')" = 0
          gh release upload "$TAG" \
            "artifact/$GENERAL" \
            artifact/SHA256SUMS-Linux-x64.txt \
            artifact/BUILD-MANIFEST-Linux-x64.json \
            --repo "$REPO"
      - name: Verify public assets and digests
        run: |
          set -euxo pipefail
          ROCKY_SHA="$(cut -d' ' -f1 artifact/SHA256SUMS-Linux-x64.txt)"
          test "$(gh api repos/$REPO/releases/tags/$TAG --jq '.assets[] | select(.name==env.GENERAL) | .digest')" = "sha256:$ROCKY_SHA"
          test "$(gh api repos/$REPO/releases/tags/$PREVIOUS_TAG --jq '.assets[] | select(.name==env.UBUNTU) | .digest')" = "sha256:$UBUNTU_SHA"
          gh api repos/$REPO/releases/tags/$TAG --jq '[.assets[].name]'

      - name: Preserve publication evidence
        uses: actions/upload-artifact@v4
        with:
          name: Stable-Linux-publication-evidence
          path: |
            artifact/BUILD-MANIFEST-Linux-x64.json
            artifact/SHA256SUMS-Linux-x64.txt
            ubuntu-startup.log
          retention-days: 14
